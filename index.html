<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Curse Land</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:'Georgia',serif;-webkit-user-select:none;user-select:none;}
@media screen and (orientation:portrait){#rotWrap{display:flex!important;}}
#rotWrap{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.rotIcon{font-size:54px;animation:rotAnim 2s ease-in-out infinite;}
@keyframes rotAnim{0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}}
.rotTxt{color:#f0d060;font-size:13px;letter-spacing:2px;text-align:center;line-height:1.7;}
#gc{position:fixed;inset:0;width:100vw;height:100vh;display:block;}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
/* Status bars top-left */
#sb{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;}
.br{display:flex;align-items:center;gap:5px;}
.bl{color:#ccc;font-size:9px;text-shadow:1px 1px 2px #000;width:14px;}
.bt{width:110px;height:10px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2);border-radius:5px;overflow:hidden;}
#hf{height:100%;background:linear-gradient(90deg,#8b0000,#e74c3c);width:100%;transition:width .2s;}
#sf{height:100%;background:linear-gradient(90deg,#1a7a30,#2ecc71);width:100%;transition:width .2s;}
/* Top center */
#tc{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;}
#pn{color:#f0d060;font-size:10px;letter-spacing:2px;text-shadow:0 0 8px #000;}
#lb{background:rgba(0,0,0,.75);border:1px solid #8b6914;color:#f0d060;font-size:9px;padding:1px 10px;border-radius:10px;}
#zl{color:#f0d060cc;font-size:8px;letter-spacing:2px;}
/* Minimap */
#mm{position:absolute;top:7px;right:8px;pointer-events:none;}
#mc{width:88px;height:88px;border:2px solid #8b6914;border-radius:50%;background:#111;display:block;}
/* Joystick */
#lc{position:absolute;bottom:16px;left:14px;pointer-events:all;}
#jz{width:98px;height:98px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;}
#jk{width:36px;height:36px;background:radial-gradient(circle at 35% 35%,#f0d060,#8b6914 70%,#5a3d00);border-radius:50%;position:absolute;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;}
/* Action buttons */
#rc{position:absolute;bottom:16px;right:10px;pointer-events:all;display:grid;grid-template-columns:50px 50px;grid-template-rows:50px 50px;gap:7px;}
.ab{width:50px;height:50px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.5);transition:transform .08s,filter .08s;}
.ab:active{transform:scale(.84);filter:brightness(1.4);}
#bsw{background:rgba(160,30,30,.85);border-color:#e74c3c;}
#bbw{background:rgba(30,80,160,.85);border-color:#3498db;}
#brl{background:rgba(80,40,140,.85);border-color:#9b59b6;}
#bin{background:rgba(30,130,50,.85);border-color:#2ecc71;}
/* Bottom center */
#bc{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:9px;pointer-events:all;align-items:center;}
.ub{width:42px;height:42px;background:rgba(0,0,0,.62);border:1.5px solid rgba(240,208,96,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#f0d060;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .08s;}
.ub:active{transform:scale(.84);}
#biv{width:50px;height:50px;font-size:20px;border-color:#f0d060;background:rgba(0,0,0,.72);}
/* Weapon wheel */
#wo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;pointer-events:all;}
#wo.on{display:block;}
#ww{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;display:none;z-index:51;pointer-events:all;}
#ww.on{display:block;}
#wc{width:240px;height:240px;}
#wctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;background:rgba(5,5,15,.92);border:2px solid #f0d060;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;pointer-events:none;}
#wlb{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);color:#f0d060;font-size:10px;letter-spacing:1px;white-space:nowrap;text-shadow:0 0 8px #000;}
/* Combat indicator bar above enemy */
.ebar{position:fixed;pointer-events:none;z-index:25;}
/* Dialogue */
#dlg{position:fixed;bottom:0;left:0;width:100%;z-index:60;display:none;pointer-events:all;}
#dlg.on{display:block;}
#db{background:linear-gradient(180deg,#0d1020,#151530);border:3px solid #f0d060;border-bottom:none;border-radius:14px 14px 0 0;margin:0 5px;overflow:hidden;box-shadow:0 -6px 24px rgba(0,0,0,.8);}
#dh{background:linear-gradient(90deg,#2d1800,#5c3600);padding:5px 12px;border-bottom:1px solid #8b6914;display:flex;align-items:center;gap:9px;}
#dp{width:34px;height:34px;border:2px solid #f0d060;border-radius:6px;background:#222;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
#dn{color:#f0d060;font-size:11px;letter-spacing:1px;font-weight:bold;}
#djob{color:#aaa;font-size:9px;margin-left:4px;}
#dm{margin-left:auto;font-size:16px;}
#dt{padding:10px 14px 7px;color:#e8e8d8;font-size:11px;line-height:1.7;min-height:54px;border-bottom:1px solid rgba(240,208,96,.12);}
#dc{padding:5px 13px 4px;display:flex;flex-direction:column;gap:3px;}
.dc{background:rgba(255,255,255,.06);border:1px solid rgba(240,208,96,.32);border-radius:4px;color:#f0d060;padding:5px 9px;font-size:10px;cursor:pointer;}
.dc:active{background:rgba(240,208,96,.2);}
#dct{text-align:right;padding:2px 13px 7px;color:#f0d060;font-size:9px;animation:bl 1s infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.15;}}
/* Panels */
.pan{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(84vw,340px);border:2px solid #8b6914;border-radius:10px;display:none;z-index:70;pointer-events:all;overflow:hidden;}
.pan.on{display:block;}
.ph{background:linear-gradient(90deg,#2d1800,#5c3600);padding:9px 13px;display:flex;justify-content:space-between;align-items:center;}
.ph span{color:#f0d060;font-size:12px;letter-spacing:2px;}
.pc{color:#f0d060;font-size:17px;background:none;border:none;cursor:pointer;padding:0 3px;}
.pb{background:linear-gradient(180deg,#1a0d00,#2d1b00);padding:11px;max-height:56vh;overflow-y:auto;}
.qi{background:rgba(255,255,255,.05);border:1px solid rgba(240,208,96,.18);border-radius:6px;padding:7px 9px;margin-bottom:7px;}
.qt{color:#f0d060;font-size:10px;font-weight:bold;}
.qd{color:#aaa;font-size:9px;margin-top:3px;line-height:1.4;}
.qtg{display:inline-block;font-size:8px;padding:1px 5px;border-radius:3px;margin-top:3px;}
.qtg.act{background:rgba(52,152,219,.3);color:#3498db;}
.qtg.dn{background:rgba(46,204,113,.3);color:#2ecc71;}
#sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sc{background:rgba(255,255,255,.06);border:1px solid rgba(240,208,96,.2);border-radius:8px;padding:9px 4px;text-align:center;cursor:pointer;transition:border-color .15s;}
.sc:active,.sc.mx{border-color:#f0d060;}
.si{font-size:20px;}.sn{color:#f0d060;font-size:8px;margin-top:2px;}.slv{color:#888;font-size:8px;}
#spi{text-align:center;color:#f0d060;font-size:10px;padding:7px 0 3px;border-top:1px solid rgba(240,208,96,.15);margin-top:5px;}
/* Pause */
#pm{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;}
#pm.on{display:flex;}
#pt{color:#f0d060;font-size:min(6vw,22px);letter-spacing:5px;text-shadow:0 0 24px #f0d060,0 0 48px #c03000;margin-bottom:8px;}
.pb2{width:min(68vw,195px);padding:10px;background:rgba(240,208,96,.08);border:1px solid #8b6914;border-radius:6px;color:#f0d060;font-size:11px;letter-spacing:2px;cursor:pointer;text-align:center;}
.pb2:active{background:rgba(240,208,96,.25);}
/* Combat flash */
#hf2{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;background:rgba(220,30,30,.4);transition:opacity .06s;}
/* Float text */
.fd{position:fixed;pointer-events:none;font-size:17px;font-weight:bold;text-shadow:1px 1px 3px #000;z-index:35;animation:fu .9s forwards;}
.fheal{color:#44ff88;}.fdmg{color:#ff4444;}
@keyframes fu{0%{transform:translateY(0) scale(1.2);opacity:1;}100%{transform:translateY(-55px) scale(.8);opacity:0;}}
/* Combo counter */
#combo{position:fixed;top:50%;right:16px;transform:translateY(-50%);color:#f0d060;font-size:22px;font-weight:bold;text-shadow:0 0 12px #f0d060,0 0 24px #c03000;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;}
#combo.show{opacity:1;}
/* Notif */
#nf{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid #8b6914;border-radius:6px;color:#f0d060;padding:6px 14px;font-size:10px;letter-spacing:1px;z-index:80;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;}
#nf.on{opacity:1;}
/* Loading */
#ls{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0800 0%,#000 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#lt{color:#f0d060;font-size:min(7vw,28px);letter-spacing:min(1.5vw,7px);text-shadow:0 0 30px #f0d060,0 0 60px #c03000;margin-bottom:4px;}
#ls2{color:#8b6914;font-size:min(2.5vw,10px);letter-spacing:4px;margin-bottom:32px;}
#lb2{width:min(58vw,220px);height:3px;background:#222;border-radius:2px;overflow:hidden;}
#lf{height:100%;background:linear-gradient(90deg,#c03000,#f0d060);width:0%;transition:width .1s;}
#lm{color:#555;font-size:9px;margin-top:11px;letter-spacing:1px;}
/* Enemy health bar */
#enemyHP{position:fixed;top:30%;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;z-index:25;pointer-events:none;}
#enemyHP.on{display:flex;}
#ehpName{color:#ff6666;font-size:10px;letter-spacing:1px;margin-bottom:2px;}
#ehpBar{width:140px;height:7px;background:rgba(0,0,0,.7);border:1px solid #ff4444;border-radius:4px;overflow:hidden;}
#ehpFill{height:100%;background:linear-gradient(90deg,#8b0000,#ff4444);transition:width .15s;}
/* NPC job tag */
.jobtag{display:inline-block;background:rgba(52,152,219,.25);border:1px solid #3498db;color:#7fc8f8;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:5px;}
</style>
</head>
<body>
<div id="rotWrap"><div class="rotIcon">📱</div><div class="rotTxt">ROTATE YOUR DEVICE<br>TO LANDSCAPE MODE</div></div>
<div id="ls"><div id="lt">⚔ CURSE LAND</div><div id="ls2">MEDIEVAL RPG</div><div id="lb2"><div id="lf"></div></div><div id="lm">Loading…</div></div>

<canvas id="gc"></canvas>

<div id="hud">
  <div id="sb">
    <div class="br"><span class="bl">HP</span><div class="bt"><div id="hf"></div></div></div>
    <div class="br"><span class="bl">SP</span><div class="bt"><div id="sf"></div></div></div>
  </div>
  <div id="tc"><div id="pn">BOY WARRIOR</div><div id="lb">LV 1 &nbsp;|&nbsp;<span id="gc2">50</span>💰</div><div id="zl">VILLAGE CENTER</div></div>
  <div id="mm"><canvas id="mc" width="88" height="88"></canvas></div>
  <div id="lc"><div id="jz"><div id="jk"></div></div></div>
  <div id="rc">
    <div class="ab" id="bsw" title="Sword">⚔️</div>
    <div class="ab" id="bbw" title="Bow">🏹</div>
    <div class="ab" id="brl" title="Dodge">💨</div>
    <div class="ab" id="bin" title="Talk">💬</div>
  </div>
  <div id="bc">
    <div class="ub" id="bmp">🗺</div>
    <div class="ub" id="biv">⚙️</div>
    <div class="ub" id="bcm">👁</div>
    <div class="ub" id="bps">⏸</div>
  </div>
</div>

<div id="combo"></div>
<div id="enemyHP"><div id="ehpName">WOLF</div><div id="ehpBar"><div id="ehpFill" style="width:100%"></div></div></div>

<div id="wo"></div>
<div id="ww"><canvas id="wc" width="240" height="240"></canvas><div id="wctr">⚔️</div><div id="wlb">SWORD</div></div>

<div id="dlg">
  <div id="db">
    <div id="dh"><div id="dp">👤</div><div id="dn">NPC</div><span id="djob" class="jobtag"></span><div id="dm">😐</div></div>
    <div id="dt"></div>
    <div id="dc"></div>
    <div id="dct">▼ TAP TO CONTINUE</div>
  </div>
</div>

<div class="pan" id="qp"><div class="ph"><span>📜 QUESTS</span><button class="pc" id="qc">✕</button></div><div class="pb" id="ql"></div></div>
<div class="pan" id="skp"><div class="ph"><span>✨ SKILLS</span><button class="pc" id="skc">✕</button></div><div class="pb"><div id="sg"></div><div id="spi">Skill Points: <span id="spc">3</span></div></div></div>

<div id="pm"><div id="pt">⚔ PAUSED</div><div class="pb2" id="pr">▶ RESUME</div><div class="pb2" id="pq">📜 QUESTS</div><div class="pb2" id="ps">✨ SKILLS</div><div class="pb2" id="prs">↺ RESTART</div></div>
<div id="hf2"></div>
<div id="nf"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ══════════════════════════════════════════════════
//  CURSE LAND v3 — Full Engine
// ══════════════════════════════════════════════════
const $=id=>document.getElementById(id);

// ── RENDERER ──
const canvas=$('gc');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',alpha:false});
renderer.setClearColor(0x87ceeb,1);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.BasicShadowMap;
renderer.autoClear=true;

function onResize(){
  const W=window.innerWidth,H=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  renderer.setSize(W,H);
  cam.aspect=W/H; cam.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,300));

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.FogExp2(0x9dd4e8,0.008);

const clock=new THREE.Clock();
let paused=false,slowMo=1.0,gameTime=0;

// ── CAMERA ──
const cam=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.2,300);
let camYaw=0,camPitch=0.40,camMode='third';
const CAM_D=9;
onResize();

// ── LIGHTING ──
scene.add(new THREE.AmbientLight(0xd8ccb0,0.7));
const sun=new THREE.DirectionalLight(0xffd090,1.15);
sun.position.set(60,90,40);
sun.castShadow=true;
sun.shadow.mapSize.set(512,512);
sun.shadow.camera.near=1;sun.shadow.camera.far=220;
sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;
sun.shadow.bias=-0.001;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87ceeb,0x4a7030,0.5));

// ══════════════════════════════════════════════════
//  SKYBOX — uses top/front/back/right/left/bottom.png
//  Falls back to gradient sphere if images not found
// ══════════════════════════════════════════════════
(function buildSkybox(){
  const loader=new THREE.CubeTextureLoader();
  // Try loading from ./skybox/ folder
  // Files: right.png, left.png, top.png, bottom.png, front.png, back.png
  // THREE.js CubeTextureLoader order: px,nx,py,ny,pz,nz
  // = right, left, top, bottom, front, back
  try{
    loader.setPath('./skybox/');
    const cubeMap=loader.load(
      ['right.png','left.png','top.png','bottom.png','front.png','back.png'],
      ()=>{ scene.background=cubeMap; },
      undefined,
      ()=>{ buildFallbackSky(); }
    );
  } catch(e){ buildFallbackSky(); }
})();

function buildFallbackSky(){
  // Gradient sky dome
  const g=new THREE.SphereGeometry(240,16,8);
  const pos=g.attributes.position;
  const ca=[];
  for(let i=0;i<pos.count;i++){
    const t=Math.max(0,Math.min(1,(pos.getY(i)+240)/480));
    ca.push(0.53+t*0.1, 0.72+t*0.06, 0.82-t*0.15);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(ca,3));
  scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
}

// ══════════════════════════════════════════════════
//  MATERIALS
// ══════════════════════════════════════════════════
const M={
  gnd:  new THREE.MeshLambertMaterial({color:0x5a8840}),
  gnd2: new THREE.MeshLambertMaterial({color:0x4a7830}),// darker forest floor
  dirt: new THREE.MeshLambertMaterial({color:0x8a7050}),
  road: new THREE.MeshLambertMaterial({color:0xc0a060}),
  path: new THREE.MeshLambertMaterial({color:0xa08840}),
  hB:   new THREE.MeshLambertMaterial({color:0xcc9060}),
  hP:   new THREE.MeshLambertMaterial({color:0xddb880}),
  rR:   new THREE.MeshLambertMaterial({color:0x882800}),
  rD:   new THREE.MeshLambertMaterial({color:0x442010}),
  rG:   new THREE.MeshLambertMaterial({color:0x666666}),
  st:   new THREE.MeshLambertMaterial({color:0x888888}),
  wd:   new THREE.MeshLambertMaterial({color:0x7a4a1a}),
  tk:   new THREE.MeshLambertMaterial({color:0x4a2a0a}),
  lf:   new THREE.MeshLambertMaterial({color:0x2a5a14}),
  lf2:  new THREE.MeshLambertMaterial({color:0x1e4a0e}),
  lf3:  new THREE.MeshLambertMaterial({color:0x3a6a1e}),
  sk:   new THREE.MeshLambertMaterial({color:0xf0c870}),
  nG:   new THREE.MeshLambertMaterial({color:0x4a8a50}),
  nA:   new THREE.MeshLambertMaterial({color:0xaa4030}),
  nN:   new THREE.MeshLambertMaterial({color:0x8080a0}),
  en:   new THREE.MeshLambertMaterial({color:0xcc2020}),
  en2:  new THREE.MeshLambertMaterial({color:0x8b1010}),
  pl:   new THREE.MeshLambertMaterial({color:0x3070c0}),
  ar:   new THREE.MeshLambertMaterial({color:0x707088}),
  fn:   new THREE.MeshLambertMaterial({color:0x70b0cc}),
  mk:   new THREE.MeshLambertMaterial({color:0xc04020}),
  mk2:  new THREE.MeshLambertMaterial({color:0x1060a0}),
  ru:   new THREE.MeshLambertMaterial({color:0x707060}),
  fi:   new THREE.MeshLambertMaterial({color:0xff6600,emissive:0xff3300,emissiveIntensity:0.9}),
  fc:   new THREE.MeshLambertMaterial({color:0x6a4a20}),
  wat:  new THREE.MeshLambertMaterial({color:0x2a7aaa,transparent:true,opacity:0.78}),
  wat2: new THREE.MeshLambertMaterial({color:0x1a5a88,transparent:true,opacity:0.65}),
  grass:new THREE.MeshLambertMaterial({color:0x3a7020}),
  swordBlade:new THREE.MeshLambertMaterial({color:0xccccdd,emissive:0x222244,emissiveIntensity:0.3}),
};

// ── HELPERS ──
function bx(w,h,d,mat,x,y,z,sh=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);if(sh){m.castShadow=true;m.receiveShadow=true;}return m;
}
function cy(rt,rb,h,seg,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;
}
function sp(r,seg,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;return m;
}
function cn(r,h,seg,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;return m;
}
function plane(w,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
  m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;return m;
}

// ── COLLIDERS ──
const COL=[];
function addC(x,z,rx,rz){COL.push({x,z,rx,rz});}
function hitC(nx,nz,pr=0.55){
  for(const c of COL){if(Math.abs(nx-c.x)<c.rx+pr&&Math.abs(nz-c.z)<c.rz+pr)return true;}
  return false;
}

// ══════════════════════════════════════════════════
//  CHUNK / ZONE SYSTEM
// ══════════════════════════════════════════════════
const CHUNKS={
  village:{cx:0,  cz:0,   lR:65, uR:95,  loaded:false},
  market: {cx:100,cz:0,   lR:75, uR:115, loaded:false},
  forest: {cx:0,  cz:-100,lR:75, uR:115, loaded:false},
  outer:  {cx:-100,cz:50, lR:75, uR:115, loaded:false},
};
const CM={village:[],market:[],forest:[],outer:[]};
let npcs=[],enemies=[],waterMeshes=[];

function cDist(id,px,pz){const c=CHUNKS[id];return Math.hypot(px-c.cx,pz-c.cz);}
function addM(id,o){CM[id].push(o);scene.add(o);return o;}

function loadChunk(id){
  if(CHUNKS[id].loaded)return; CHUNKS[id].loaded=true;
  if(id==='village')bldVillage();
  else if(id==='market')bldMarket();
  else if(id==='forest')bldForest();
  else if(id==='outer')bldOuter();
}
function unloadChunk(id){
  if(id==='village'||!CHUNKS[id].loaded)return;
  CHUNKS[id].loaded=false;
  CM[id].forEach(o=>{scene.remove(o);});CM[id]=[];
  npcs=npcs.filter(n=>n.chunk!==id);
  enemies=enemies.filter(e=>e.chunk!==id);
}
let chkT=0;
function tickChunks(px,pz,dt){
  chkT+=dt; if(chkT<0.5)return; chkT=0;
  for(const id in CHUNKS){
    const d=cDist(id,px,pz);
    if(!CHUNKS[id].loaded&&d<CHUNKS[id].lR)loadChunk(id);
    else if(CHUNKS[id].loaded&&d>CHUNKS[id].uR&&id!=='village')unloadChunk(id);
  }
}

// ══════════════════════════════════════════════════
//  GLB MODEL LOADER  (trees.glb, boy_warrior.glb)
// ══════════════════════════════════════════════════
// THREE r128 doesn't have GLTFLoader built-in — we use an inline minimal loader
// that loads from ./models/ folder if available, otherwise uses procedural fallback.
// This approach keeps the game fully functional without models.

let playerModelLoaded=false;
let treeTemplate=null; // will hold cloned tree group

// Minimal GLTF loader injection (r128 compatible)
const GLTF_CDN='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js';

function loadScript(src,cb){
  const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>cb(null);document.head.appendChild(s);
}

function tryLoadGLB(path,onSuccess,onFail){
  if(typeof THREE.GLTFLoader==='undefined'){onFail();return;}
  const loader=new THREE.GLTFLoader();
  loader.load(path,onSuccess,undefined,onFail);
}

  // Cape
  const cape=bx(.82,.9,.08,M.rD,0,1.1,-.28);

}

const SW=new THREE.Group();
buildProceduralPlayer();

// Try to replace with GLB
loadScript(GLTF_CDN,()=>{
  tryLoadGLB('./models/boy_warrior.glb',gltf=>{
    // remove procedural parts
    while(PG.children.length>0)PG.remove(PG.children[0]);
    const model=gltf.scene;
    model.scale.set(1,1,1);
    model.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
    PG.add(model);
    playerModelLoaded=true;
  },()=>{/* keep procedural */});

  // Load tree template
  tryLoadGLB('./models/trees.glb',gltf=>{
    treeTemplate=gltf.scene;
    treeTemplate.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
  },()=>{/* use procedural */});
});

// ══════════════════════════════════════════════════
//  TREE BUILDER (uses GLB if loaded, else procedural)
// ══════════════════════════════════════════════════
function bldTree(cx,cz,h,chunk){
  let g;
  if(treeTemplate){
    g=treeTemplate.clone();
    const s=0.8+Math.random()*.6;
    g.scale.set(s,s+(h-3)*.12,s);
  } else {
    g=new THREE.Group();
    g.add(cy(.18,.28,h,5,M.tk,0,h/2,0));
    const lr=1.4+Math.random()*.9;
    const lmat=[M.lf,M.lf2,M.lf3][Math.floor(Math.random()*3)];
    g.add(sp(lr,5,lmat,0,h+lr*.45,0));
    // extra foliage layer
    g.add(sp(lr*.7,4,lmat,0,h+lr*.0,0));
  }
  g.position.set(cx,0,cz);
  g.rotation.y=Math.random()*Math.PI*2;
  addM(chunk,g);
  addC(cx,cz,.42,.42);
}

// ══════════════════════════════════════════════════
//  WATER RIVER SYSTEM
//  Uses water.gif as texture, floating animation
// ══════════════════════════════════════════════════
function buildRiver(cx,cz,chunk){
  // Create a flowing river using tiled texture or fallback animated material
  const riverWidth=8;
  const riverLen=80;

  // Try to load water.gif texture
  const texLoader=new THREE.TextureLoader();
  let riverMat=M.wat;
  texLoader.load('./textures/water.gif',tex=>{
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
    tex.repeat.set(4,16);
    riverMat.map=tex;
    riverMat.needsUpdate=true;
  },undefined,()=>{
    // fallback: animated blue material (already set)
  });

  // River segments — follows the map curve (north side)
  const riverPts=[
    new THREE.Vector3(-40,0,-60),
    new THREE.Vector3(-20,0,-75),
    new THREE.Vector3(0,0,-85),
    new THREE.Vector3(20,0,-80),
    new THREE.Vector3(35,0,-70),
    new THREE.Vector3(45,0,-55),
  ];

  for(let i=0;i<riverPts.length-1;i++){
    const a=riverPts[i],b=riverPts[i+1];
    const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);
    const waterMesh=new THREE.Mesh(
      new THREE.PlaneGeometry(riverWidth,len,1,4),
      new THREE.MeshLambertMaterial({color:0x2a7aaa,transparent:true,opacity:0.80})
    );
    waterMesh.rotation.x=-Math.PI/2;
    waterMesh.rotation.z=-Math.atan2(dx,dz);
    waterMesh.position.set((a.x+b.x)/2,.05,(a.z+b.z)/2);
    waterMesh.receiveShadow=true;
    waterMesh._waterPhase=Math.random()*Math.PI*2;
    addM(chunk,waterMesh);
    waterMeshes.push(waterMesh);
    // Banks
    const bankL=plane(2,len,M.dirt,(a.x+b.x)/2+Math.cos(-Math.atan2(dx,dz))*5,.02,(a.z+b.z)/2);
    bankL.rotation.z=-Math.atan2(dx,dz);
    addM(chunk,bankL);
  }
}

function animateWater(t){
  waterMeshes.forEach(w=>{
    if(w.material&&w.material.map){
      w.material.map.offset.y+=0.008;
    }
    // gentle bobbing
    w.position.y=0.05+Math.sin(t*1.2+w._waterPhase)*0.04;
  });
}

// ══════════════════════════════════════════════════
function bldHouse(cx,cz,sx,sz,chunk,rm){
  const g=new THREE.Group();
  g.add(bx(4*sx,3.2,4*sz,M.hB,0,1.6,0));
  // upper trim
  g.add(bx(4*sx+.1,.15,4*sz+.1,M.wd,0,3.25,0));
  const rf=cn(3.0*Math.max(sx,sz),2.2,4,rm,0,4.3,0);
  rf.rotation.y=Math.PI/4;g.add(rf);
  g.add(bx(.85,1.65,.12,M.wd,0,.82,2*sz));// door
  g.add(bx(.75,.75,.1,M.fn,-1.0,2.0,2*sz));// windows
  g.add(bx(.75,.75,.1,M.fn, 1.0,2.0,2*sz));
  // chimney
  if(Math.random()>.4){
    g.add(bx(.35,.6,.35,M.st,1.2*sx,4.5,0.8*sz));
  }
  g.position.set(cx,0,cz);
  addM(chunk,g);
  addC(cx,cz,2*sx,2*sz);
}

function bldRock(cx,cz,s,chunk){
  const m=sp(s,5,M.st,cx,s*.55,cz);
  m.scale.set(1+Math.random()*.3,.5+Math.random()*.3,1+Math.random()*.3);
  addM(chunk,m);
  if(s>.7)addC(cx,cz,s*.65,s*.65);
}

function bldRoad(x1,z1,x2,z2,w,chunk,mat=M.road){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const m=bx(w,.06,len,mat,(x1+x2)/2,.03,(z1+z2)/2,false);
  m.rotation.y=Math.atan2(dx,dz);m.receiveShadow=true;
  addM(chunk,m);
}

function bldPlane(cx,cz,w,d,mat,chunk,yo=0){
  const m=plane(w,d,mat,cx,yo,cz);
  addM(chunk,m);
}

// ══════════════════════════════════════════════════
//  COMBAT SYSTEM — IMPROVED
// ══════════════════════════════════════════════════
const ATK_RANGE={sword:3.4,bow:24,throwable:18,potion:0};
const ATK_CD={sword:.55,bow:1.1,throwable:.8,potion:0};
let atkT=0,atkAnimT=0;

function getAtkDmg(){
  const base=8+P.skills.strength.lv*4;
  const isCrit=Math.random()<.15+P.skills.archery.lv*.02;
  const bowBonus=(P.weapon==='bow'?P.skills.archery.lv*3:0);
  return {dmg:Math.round(base+bowBonus+(isCrit?base*.5:0)),crit:isCrit};
}

function doAttack(){
  if(atkT>0||!P.alive||P.state==='dead')return;
  atkT=ATK_CD[P.weapon]||.55;
  atkAnimT=.35;
  P.state='attack';

  const range=ATK_RANGE[P.weapon]||3.4;

  // Arc sweep for sword (hits multiple enemies in cone)
  const sweepAngle=P.weapon==='sword'?Math.PI/2.2:Math.PI/18;

  let hitAny=false;
  const atkDmg=getAtkDmg();

  enemies.forEach(e=>{
    if(!e.alive)return;
    const dx=e.x-P.pos.x, dz=e.z-P.pos.z;
    const dist=Math.hypot(dx,dz);
    if(dist>range)return;
    // Angle check for sword sweep
    if(P.weapon==='sword'){
      const atkDir=P.facing;
      const toEnemy=Math.atan2(-dx,-dz);
      let ang=Math.abs(atkDir-toEnemy);
      if(ang>Math.PI)ang=Math.PI*2-ang;
      if(ang>sweepAngle)return;
    }
    hitAny=true;
    e.hp-=atkDmg.dmg;
    e.lastHitT=0;
    e.state='hurt'; e.hurtT=.3;
    spawnFloat((atkDmg.crit?'💥':'-')+atkDmg.dmg,e.mesh.position,false,atkDmg.crit);
    // Knockback
    if(dist>.1){
      const kbF=1.5;e.x+=(-dx/dist)*kbF;e.z+=(-dz/dist)*kbF;
    }
    if(e.hp<=0)killE(e);
  });

  // Combo system
  if(hitAny&&P.weapon==='sword'){
    P.comboCount++;P.comboTimer=1.8;
    if(P.comboCount>=2){
      $('combo').textContent=P.comboCount+'x COMBO!';
      $('combo').classList.add('show');
      if(P.comboCount>=4)notif('⚡ PERFECT COMBO x'+P.comboCount+'!');
    }
  }

  // Sword swing animation
  if(P.weapon==='sword'){
    SW.rotation.z=-Math.PI/2.5;
    SW.rotation.x=-0.6;
    setTimeout(()=>{SW.rotation.z=0;SW.rotation.x=0;},300);
    // Slash particle (simple box flash)
    const slash=bx(.8,.1,.8,new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.7}),
      P.pos.x-Math.sin(P.facing)*2, .8, P.pos.z-Math.cos(P.facing)*2, false);
    scene.add(slash);
    setTimeout(()=>scene.remove(slash),120);
  }

  if(!hitAny&&P.weapon!=='potion')notif('No target in range!');
}

function killE(e){
  e.alive=false;e.state='dead';
  const xg=20+P.skills.defense.lv*2,gg=5+Math.floor(Math.random()*14);
  P.xp+=xg;P.gold+=gg;
  $('gc2').textContent=P.gold;
  notif(`+${xg} XP  +${gg}💰`);
  checkLvUp();
  // Death animation — fall over
  e.mesh.rotation.z=Math.PI/2;
  setTimeout(()=>scene.remove(e.mesh),2000);
  // Hunting quest
  const hq=Q.find(q=>q.id==='q2');
  if(hq&&hq.status==='active'&&e.type==='Wolf'){
    hq.prog=(hq.prog||0)+1;
    if(hq.prog>=hq.goal){hq.status='complete';notif('✅ Quest Complete: Wolf Hunt!');}
    else notif(`Wolf slain! ${hq.prog}/${hq.goal}`);
  }
}

function checkLvUp(){
  if(P.xp>=P.lv*100){
    P.xp-=P.lv*100;P.lv++;P.sp2+=2;P.mhp+=12;P.hp=P.mhp;
    $('lb').innerHTML=`LV ${P.lv} &nbsp;|&nbsp;<span id="gc2">${P.gold}</span>💰`;
    notif(`🎉 Level Up! Now LV${P.lv}!`);
    // Flash
    PG.traverse(c=>{if(c.isMesh){const oc=c.material.color.clone();c.material.color.set(0xffd700);setTimeout(()=>c.material.color.copy(oc),400);}});
  }
}

function playerHit(dmg){
  if(!P.alive||P.hurtInvincible>0||P.state==='dodge')return;
  const red=Math.max(1,dmg-P.skills.defense.lv*2);
  P.hp=Math.max(0,P.hp-red);
  P.state='hurt'; P.hurtInvincible=.6;
  const f=$('hf2');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',140);
  spawnFloat('-'+red,PG.position,false,false);
  if(P.hp<=0){P.alive=false;P.state='dead';notif('💀 You died… respawning');setTimeout(respawn,2400);}
}

function respawn(){
  P.hp=P.mhp;P.alive=true;P.state='idle';

// ══════════════════════════════════════════════════
//  ENEMY AI — FIXED & IMPROVED
// ══════════════════════════════════════════════════
function updateEnemies(dt,t){
  const px=P.pos.x,pz=P.pos.z;
  let nearestD=Infinity;

  enemies.forEach(e=>{
    if(!e.alive||e.state==='dead')return;
    const dx=px-e.x, dz=pz-e.z, dist=Math.hypot(dx,dz);
    if(dist>70)return; // cull

    // Hurt cooldown
    if(e.state==='hurt'){e.hurtT-=dt;if(e.hurtT<=0)e.state='chase';}
    e.lastHitT+=dt;

    // State machine
    if(dist<e.aggroR){
      e.state=(dist<e.atkR)?'attack':'chase';
    } else if(e.state!=='hurt'){
      e.state='patrol';
    }

    if(e.state==='patrol'){
      e.patrolA+=dt*.5;
      const px2=e.patrolCenter.x+Math.cos(e.patrolA)*5;
      const pz2=e.patrolCenter.z+Math.sin(e.patrolA)*5;
      const spd=1.8*dt;
      const mvx=(px2-e.x),mvz=(pz2-e.z);
      const mlen=Math.hypot(mvx,mvz)||1;
      const nx=e.x+mvx/mlen*spd, nz=e.z+mvz/mlen*spd;
      if(!hitC(nx,nz,.4)){e.x=nx;e.z=nz;}
      // Wolf walk anim
      if(e.isWolf){e.walkPhase+=dt*6;animateWolfLegs(e,t);}
    }

    if(e.state==='chase'&&dist>.5){
      const spd=(e.isWolf?4.2:3.5)*dt;
      const nx=e.x+dx/dist*spd, nz=e.z+dz/dist*spd;
      if(!hitC(nx,nz,.4)){e.x=nx;e.z=nz;}
      e.mesh.lookAt(px,0,pz);
      if(e.isWolf){e.walkPhase+=dt*9;animateWolfLegs(e,t);}
    }

    if(e.state==='attack'){
      e.atkT-=dt;
      if(e.atkT<=0){
        playerHit(e.isWolf?8:12);
        e.atkT=e.isWolf?1.4:1.8;
        // Attack animation — lunge
        e.mesh.position.set(e.x+dx/dist*.5,0,e.z+dz/dist*.5);
        setTimeout(()=>{e.mesh.position.set(e.x,0,e.z);},180);
      }
    }

    e.mesh.position.x=e.x; e.mesh.position.z=e.z;

    // Track nearest for HP bar
    if(dist<nearestD&&dist<20){nearestD=dist;focusEnemy=e;}
  });
  if(nearestD>20)focusEnemy=null;
  updateEnemyHPBar();
}

function animateWolfLegs(e,t){
  // Animate wolf legs with walking motion
  const stride=Math.sin(e.walkPhase);
  if(e.mesh.children.length>=7){
    e.mesh.children[2].position.z=.2+stride*.18;  // FL
    e.mesh.children[3].position.z=.2-stride*.18;  // FR
    e.mesh.children[4].position.z=-.2-stride*.18; // BL
    e.mesh.children[5].position.z=-.2+stride*.18; // BR
  }
}

// ══════════════════════════════════════════════════
//  NPC AI — JOBS & MOVEMENT
// ══════════════════════════════════════════════════
function updateNPCs(dt,t){
  npcs.forEach(n=>{
    const d=Math.hypot(n.x-P.pos.x,n.z-P.pos.z);
    n.mesh.visible=d<65;
    if(!n.mesh.visible)return;

    // Face player when nearby
    if(d<22)n.mesh.lookAt(P.pos.x,0,P.pos.z);

    // Job-based idle animation
    n.walkPhase=(n.walkPhase||0)+dt;
    const bob=Math.sin(n.walkPhase*1.5)*.04;
    n.mesh.position.y=bob;

    // Wander logic (short wander near home)
    n.wanderTimer-=dt;
    if(n.wanderTimer<=0&&!inDlg){
      n.wanderTimer=3+Math.random()*5;
      if(d>6){// don't wander toward player
        const angle=Math.random()*Math.PI*2;
        const wdist=2+Math.random()*4;
        n.wanderTarget={x:n.homeX+Math.cos(angle)*wdist, z:n.homeZ+Math.sin(angle)*wdist};
      }
    }
    // Move toward wander target
    const wdx=n.wanderTarget.x-n.x, wdz=n.wanderTarget.z-n.z;
    const wdist=Math.hypot(wdx,wdz);
    if(wdist>.4&&d>5){
      const spd=1.2*dt;
      n.x+=wdx/wdist*spd; n.z+=wdz/wdist*spd;
      n.mesh.position.x=n.x; n.mesh.position.z=n.z;
    }
  });
}

// ══════════════════════════════════════════════════
//  PLAYER ANIMATION
// ══════════════════════════════════════════════════
function animatePlayer(dt,t,moving){
  if(!playerModelLoaded){
    // Procedural walk animation
    if(moving&&P.state!=='attack'){
      PG.position.y=Math.abs(Math.sin(t*8))*.08;
      // Leg swing
      const children=PG.children;
      if(children[0]){children[0].rotation.x=Math.sin(t*8)*.35;} // legL
      if(children[1]){children[1].rotation.x=-Math.sin(t*8)*.35;} // legR
    } else {
      PG.position.y=0;
      if(PG.children[0])PG.children[0].rotation.x=0;
      if(PG.children[1])PG.children[1].rotation.x=0;
    }
    // Attack animation
    if(P.state==='attack'){
      atkAnimT-=dt;
      if(atkAnimT>0){
        const arm=PG.children[6];
        if(arm)arm.rotation.x=-Math.sin((1-atkAnimT/.35)*Math.PI)*1.2;
      } else {
        const arm=PG.children[6];
        if(arm)arm.rotation.x=0;
        if(P.state==='attack')P.state='idle';
      }
    }
    // Hurt flash
    if(P.hurtInvincible>0){
      const flash=Math.floor(t*12)%2;
      PG.visible=flash===0;
    } else PG.visible=true;
  }
}

// ══════════════════════════════════════════════════
//  WEAPON WHEEL
// ══════════════════════════════════════════════════
const WS=[
  {name:'Sword',   icon:'⚔️',col:'#cc2222'},
  {name:'Bow',     icon:'🏹',col:'#2255cc'},
  {name:'Throwable',icon:'💣',col:'#cc6600'},
  {name:'Potion',  icon:'🧪',col:'#22cc55'},
];
let selW=0,wOpen=false;

function drawWheel(hov){
  const cv=$('wc'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,240,240);
  const CX=120,CY=120,OR=108,IR=34;
  WS.forEach((w,i)=>{
    const sA=((i*90-45)*Math.PI/180)-Math.PI/2;
    const eA=((i*90+45)*Math.PI/180)-Math.PI/2;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,OR,sA,eA);ctx.closePath();
    ctx.fillStyle=i===hov?w.col+'dd':w.col+'55';ctx.fill();
    ctx.strokeStyle=i===hov?'#f0d060':'#ffffff33';ctx.lineWidth=i===hov?2.5:1;ctx.stroke();
    const mA=(i*90*Math.PI/180)-Math.PI/2;
    ctx.font='22px serif';ctx.fillText(w.icon,CX+Math.cos(mA)*72-11,CY+Math.sin(mA)*72+8);
    ctx.fillStyle=i===hov?'#f0d060':'#aaa';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText(w.name,CX+Math.cos(mA)*90,CY+Math.sin(mA)*90+3);ctx.textAlign='left';
  });
  ctx.beginPath();ctx.arc(CX,CY,IR,0,Math.PI*2);
  ctx.fillStyle='rgba(5,5,15,.9)';ctx.fill();
  ctx.strokeStyle='#f0d060aa';ctx.lineWidth=2;ctx.stroke();
  $('wctr').textContent=WS[selW].icon;
  $('wlb').textContent=WS[selW].name.toUpperCase();
}
function openWheel(){wOpen=true;slowMo=.18;$('ww').classList.add('on');$('wo').classList.add('on');drawWheel(selW);}
function closeWheel(){wOpen=false;slowMo=1;$('ww').classList.remove('on');$('wo').classList.remove('on');P.weapon=WS[selW].name.toLowerCase();}
let wHT=null;
$('biv').addEventListener('touchstart',e=>{e.preventDefault();wHT=setTimeout(openWheel,180);},{passive:false});
$('biv').addEventListener('touchend',e=>{e.preventDefault();clearTimeout(wHT);if(wOpen)closeWheel();},{passive:false});
$('biv').addEventListener('mousedown',()=>{wHT=setTimeout(openWheel,180);});
$('biv').addEventListener('mouseup',()=>{clearTimeout(wHT);if(wOpen)closeWheel();});
function wSlot(mx,my){const r=$('wc').getBoundingClientRect();const dx=mx-(r.left+120),dy=my-(r.top+120);if(Math.hypot(dx,dy)<30)return selW;return Math.floor(((Math.atan2(dy,dx)*180/Math.PI+90+360)%360+45)/90)%4;}
$('wc').addEventListener('touchmove',e=>{const t=e.changedTouches[0];const i=wSlot(t.clientX,t.clientY);selW=i;drawWheel(i);},{passive:true});
$('wc').addEventListener('mousemove',e=>{if(!wOpen)return;const i=wSlot(e.clientX,e.clientY);selW=i;drawWheel(i);});

// ══════════════════════════════════════════════════
//  JOYSTICK
// ══════════════════════════════════════════════════
const jz=$('jz'),jk=$('jk');
const JMAX=33;
let jA=false,jTID=-1,jDX=0,jDZ=0,jO={x:0,y:0};
jz.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jTID=t.identifier;jA=true;const r=jz.getBoundingClientRect();jO={x:r.left+r.width/2,y:r.top+r.height/2};},{passive:false});
jz.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==jTID)continue;let dx=t.clientX-jO.x,dy=t.clientY-jO.y;const d=Math.hypot(dx,dy);if(d>JMAX){dx*=JMAX/d;dy*=JMAX/d;}jk.style.transform=`translate(${dx}px,${dy}px)`;jDX=dx/JMAX;jDZ=dy/JMAX;}},{passive:false});
function rj(){jA=false;jDX=0;jDZ=0;jk.style.transform='translate(0,0)';}
jz.addEventListener('touchend',rj);jz.addEventListener('touchcancel',rj);
const KB={};
window.addEventListener('keydown',e=>{KB[e.code]=true;});
window.addEventListener('keyup',e=>{KB[e.code]=false;});

// Camera drag
let cDID=-1,cLX=0,cLY=0;
canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(cDID!==-1)continue;cDID=t.identifier;cLX=t.clientX;cLY=t.clientY;}},{passive:true});
canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier!==cDID)continue;camYaw-=(t.clientX-cLX)*.005;camPitch=Math.max(.08,Math.min(1.15,camPitch+(t.clientY-cLY)*.004));cLX=t.clientX;cLY=t.clientY;}},{passive:true});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===cDID)cDID=-1;});
let mD=false;
canvas.addEventListener('mousedown',e=>{mD=true;cLX=e.clientX;cLY=e.clientY;});
canvas.addEventListener('mousemove',e=>{if(!mD)return;camYaw-=(e.clientX-cLX)*.005;camPitch=Math.max(.08,Math.min(1.15,camPitch+(e.clientY-cLY)*.004));cLX=e.clientX;cLY=e.clientY;});
canvas.addEventListener('mouseup',()=>mD=false);

// ── Dialogue ──
let aNPC=null,inDlg=false,typT=null;
function openDlg(npc){
  aNPC=npc;inDlg=true;
  $('dp').textContent=npc.pt;$('dn').textContent=npc.name;
  $('djob').textContent=npc.job;
  $('dm').textContent=npc.mood==='good'?'😊':npc.mood==='angry'?'😠':'😐';
  $('dlg').classList.add('on');typeT(npc.dlg[0]);bldChoices(npc);
  // Complete story quest if it's the Hermit
  if(npc.name==='Hermit Gal'){const sq=Q.find(q=>q.id==='q3');if(sq&&sq.status==='active'){sq.status='complete';setTimeout(()=>notif('✅ Quest Complete: The Black Tower!'),1000);}}
}
function closeDlg(){inDlg=false;aNPC=null;$('dlg').classList.remove('on');$('dc').innerHTML='';}
function typeT(t){const el=$('dt');el.textContent='';clearTimeout(typT);let i=0;const nx=()=>{if(i<t.length){el.textContent+=t[i++];typT=setTimeout(nx,28);}};nx();}
function bldChoices(npc){
  const el=$('dc');el.innerHTML='';
  const choices=['Ask more','Trade','Farewell'];
  choices.forEach(c=>{
    const b=document.createElement('div');b.className='dc';b.textContent=c;
    b.onclick=()=>{
      if(c==='Farewell')closeDlg();
      else if(c==='Ask more'){npc.di=(npc.di+1)%npc.dlg.length;typeT(npc.dlg[npc.di]);}
      else typeT("I don't have anything to trade right now.");
    };el.appendChild(b);
  });
}
$('dlg').addEventListener('click',e=>{if(e.target.classList.contains('dc'))return;if(!aNPC)return;aNPC.di=(aNPC.di+1)%aNPC.dlg.length;typeT(aNPC.dlg[aNPC.di]);});

// ── Quest/Skill ──
function renderQ(){const el=$('ql');el.innerHTML='';Q.forEach(q=>{const d=document.createElement('div');d.className='qi';const pg=q.type==='hunting'?` (${q.prog||0}/${q.goal})`:'';d.innerHTML=`<div class="qt">${q.title}</div><div class="qd">${q.desc}${pg}</div><span class="qtg ${q.status==='complete'?'dn':'act'}">${q.status.toUpperCase()}</span>`;el.appendChild(d);});}
$('qc').onclick=()=>$('qp').classList.remove('on');
function renderSk(){const el=$('sg');el.innerHTML='';for(const k in P.skills){const s=P.skills[k];const d=document.createElement('div');d.className='sc'+(s.lv>=s.max?' mx':'');d.innerHTML=`<div class="si">${s.icon}</div><div class="sn">${s.name}</div><div class="slv">${s.lv}/${s.max}</div>`;d.onclick=()=>{if(P.sp2>0&&s.lv<s.max){s.lv++;P.sp2--;renderSk();notif(`${s.name} upgraded → LV${s.lv}!`);}};el.appendChild(d);}$('spc').textContent=P.sp2;}
$('skc').onclick=()=>$('skp').classList.remove('on');

// ── Pause ──
$('bps').addEventListener('click',()=>{paused=!paused;$('pm').classList.toggle('on',paused);});
$('pr').onclick=()=>{paused=false;$('pm').classList.remove('on');};
$('pq').onclick=()=>{renderQ();$('qp').classList.add('on');$('pm').classList.remove('on');paused=false;};
$('ps').onclick=()=>{renderSk();$('skp').classList.add('on');$('pm').classList.remove('on');paused=false;};
$('prs').onclick=()=>location.reload();

// ── Action buttons ──
$('bsw').addEventListener('click',()=>{P.weapon='sword';doAttack();});
$('bbw').addEventListener('click',()=>{P.weapon='bow';if(P.sp>=10){drainSP(10);doAttack();}else notif('Not enough stamina!');});
$('brl').addEventListener('click',()=>{
  if(P.rollCooldown>0){notif('Dodge on cooldown!');return;}
  if(P.sp<18){notif('Not enough stamina!');return;}
  drainSP(18);P.state='dodge';P.rollCooldown=1.2;
  // Roll in facing direction
  const rdx=-Math.sin(P.facing)*3.5,rdz=-Math.cos(P.facing)*3.5;
  P.pos.x+=rdx; P.pos.z+=rdz;
  PG.rotation.x=.6; setTimeout(()=>{PG.rotation.x=0;P.state='idle';},350);
  notif('Dodge Roll!');
});
$('bin').addEventListener('click',()=>{
  if(inDlg){closeDlg();return;}
  let best=null,bd=Infinity;
  npcs.forEach(n=>{const d=Math.hypot(n.x-P.pos.x,n.z-P.pos.z);if(d<bd){bd=d;best=n;}});
  if(best&&bd<5.5)openDlg(best);else notif('No one nearby to talk to.');
});
$('bcm').addEventListener('click',()=>{camMode=camMode==='third'?'first':'third';$('bcm').textContent=camMode==='first'?'🔍':'👁';notif(camMode==='first'?'First-Person':'Third-Person');});
$('bmp').addEventListener('click',()=>{renderQ();$('qp').classList.add('on');});

// ══════════════════════════════════════════════════
//  MINIMAP
// ══════════════════════════════════════════════════
const mmCv=$('mc'),mmCtx=mmCv.getContext('2d');
const MSZ=88;
function drawMM(){
  mmCtx.clearRect(0,0,MSZ,MSZ);
  mmCtx.save();
  mmCtx.beginPath();mmCtx.arc(MSZ/2,MSZ/2,MSZ/2,0,Math.PI*2);mmCtx.clip();
  mmCtx.fillStyle='#1a3010';mmCtx.fillRect(0,0,MSZ,MSZ);
  const sc=MSZ/260, ox=MSZ/2-P.pos.x*sc, oz=MSZ/2-P.pos.z*sc;
  const zc={village:'#4a7a30cc',market:'#a07030cc',forest:'#1a4a10cc',outer:'#5a6030cc'};
  for(const id in CHUNKS){const c=CHUNKS[id];mmCtx.fillStyle=zc[id];mmCtx.fillRect(ox+c.cx*sc-26,oz+c.cz*sc-26,52,52);}
  mmCtx.strokeStyle='#c0a06077';mmCtx.lineWidth=2.5;
  [[0,0,100,0],[0,0,0,-100],[0,0,-100,50]].forEach(([x1,z1,x2,z2])=>{mmCtx.beginPath();mmCtx.moveTo(ox+x1*sc,oz+z1*sc);mmCtx.lineTo(ox+x2*sc,oz+z2*sc);mmCtx.stroke();});
  // River on map
  mmCtx.strokeStyle='#4488aacc';mmCtx.lineWidth=2;
  mmCtx.beginPath();mmCtx.moveTo(ox-40*sc,oz-60*sc);mmCtx.bezierCurveTo(ox+0,oz-85*sc,ox+45*sc,oz-55*sc,ox+45*sc,oz-55*sc);mmCtx.stroke();
  mmCtx.fillStyle='#ff4444';enemies.forEach(e=>{if(!e.alive)return;mmCtx.fillRect(ox+e.x*sc-1.5,oz+e.z*sc-1.5,3,3);});
  mmCtx.fillStyle='#44ff88';npcs.forEach(n=>{mmCtx.fillRect(ox+n.x*sc-1.5,oz+n.z*sc-1.5,3,3);});
  mmCtx.fillStyle='#f0d060';mmCtx.beginPath();mmCtx.arc(MSZ/2,MSZ/2,4,0,Math.PI*2);mmCtx.fill();
  mmCtx.strokeStyle='#f0d060';mmCtx.lineWidth=1.5;
  mmCtx.beginPath();mmCtx.moveTo(MSZ/2,MSZ/2);mmCtx.lineTo(MSZ/2-Math.sin(camYaw)*9,MSZ/2-Math.cos(camYaw)*9);mmCtx.stroke();
  mmCtx.restore();
  mmCtx.strokeStyle='#8b6914';mmCtx.lineWidth=2;mmCtx.beginPath();mmCtx.arc(MSZ/2,MSZ/2,MSZ/2-1,0,Math.PI*2);mmCtx.stroke();
}

// ── Zone label ──
const ZN={village:'VILLAGE CENTER',market:'MARKET AREA',forest:'FOREST AREA',outer:'OUTER LAND'};
let lastZ='village';
function getZ(x,z){let best='village',bd=Infinity;for(const id in CHUNKS){const c=CHUNKS[id];const d=Math.hypot(x-c.cx,z-c.cz);if(d<bd){bd=d;best=id;}}return best;}

// ── LOD ──
let lodT=0;
function updLOD(dt){
  lodT+=dt;if(lodT<.6)return;lodT=0;
  const px=P.pos.x,pz=P.pos.z;
  scene.traverse(o=>{
    if(!o.isMesh)return;
    const d=Math.hypot(o.position.x-px,o.position.z-pz);
    // LOW POLY visible but no shadow
    if(d>140){o.visible=false;}
    else if(d>80){o.visible=true;o.castShadow=false;o.receiveShadow=false;}
    else if(d>40){o.visible=true;o.castShadow=false;o.receiveShadow=true;}
    else{o.visible=true;o.castShadow=true;o.receiveShadow=true;}
  });
}

let nfT=null;
function notif(msg){const el=$('nf');el.textContent=msg;el.classList.add('on');clearTimeout(nfT);nfT=setTimeout(()=>el.classList.remove('on'),2600);}

// ══════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════
let fr=0;
function loop(){
  requestAnimationFrame(loop);
  const rawDt=Math.min(clock.getDelta(),.05);
  const dt=paused?0:rawDt*slowMo;
  const t=(gameTime+=dt);

  if(!paused){
    // Input
    let mx=0,mz=0;
    if(jA){mx=jDX;mz=jDZ;}
    if(KB['KeyW']||KB['ArrowUp'])mz=-1;
    if(KB['KeyS']||KB['ArrowDown'])mz=1;
    if(KB['KeyA']||KB['ArrowLeft'])mx=-1;
    if(KB['KeyD']||KB['ArrowRight'])mx=1;
    if(KB['Space'])doAttack();
    if(KB['KeyE'])$('bin').click();
    if(KB['ShiftLeft']&&P.rollCooldown<=0)$('brl').click();

    const moving=(mx!==0||mz!==0)&&P.alive&&P.state!=='dead';

    // Movement
    if(moving&&P.state!=='attack'){
      const spd=P.spd*(P.sp>5?1:.45)*dt*(P.state==='dodge'?.5:1);
      const sy=Math.sin(camYaw),cy2=Math.cos(camYaw);
      const wx=(-sy*(-mz)+cy2*mx),wz=(-cy2*(-mz)-sy*mx);
      const len=Math.hypot(wx,wz)||1;
      const nx=P.pos.x+(wx/len)*spd, nz=P.pos.z+(wz/len)*spd;
      const B=98;
      if(!hitC(nx,P.pos.z)&&Math.abs(nx)<B)P.pos.x=nx;
      if(!hitC(P.pos.x,nz)&&Math.abs(nz)<B)P.pos.z=nz;
      P.facing=Math.atan2(-(wx/len),-(wz/len));
      PG.rotation.y=P.facing;
      if(P.sp>0&&P.state!=='dodge')drainSP(4*dt);
      if(P.state==='idle')P.state='walk';
    } else if(P.state==='walk'){ P.state='idle'; }

    regenSP(dt);
    if(atkT>0)atkT-=dt;
    if(P.hurtInvincible>0)P.hurtInvincible-=dt;
    if(P.rollCooldown>0)P.rollCooldown-=dt;

    // Combo decay
    if(P.comboTimer>0){P.comboTimer-=dt;if(P.comboTimer<=0){P.comboCount=0;$('combo').classList.remove('show');}}

    PG.position.set(P.pos.x,P.y,P.pos.z);
    animatePlayer(dt,t,moving);

    updateEnemies(dt,t);
    updateNPCs(dt,t);
    animateWater(t);

    fr++;
    if(fr%28===0)tickChunks(P.pos.x,P.pos.z,.44);
    updLOD(dt);
    if(fr%60===0){const z=getZ(P.pos.x,P.pos.z);if(z!==lastZ){lastZ=z;$('zl').textContent=ZN[z];}}

    // Camera
    if(camMode==='third'){
      cam.position.set(
        P.pos.x+Math.sin(camYaw)*Math.cos(camPitch)*CAM_D,
        Math.sin(camPitch)*CAM_D+1.8,
        P.pos.z+Math.cos(camYaw)*Math.cos(camPitch)*CAM_D
      );
      cam.lookAt(P.pos.x,1.3,P.pos.z);
    } else {
      cam.position.set(P.pos.x,1.65,P.pos.z);
      cam.rotation.order='YXZ';cam.rotation.y=camYaw;cam.rotation.x=-camPitch*.35;
    }

    $('hf').style.width=(P.hp/P.mhp*100)+'%';
    $('sf').style.width=(P.sp/P.msp*100)+'%';
    drawMM();
  }
  renderer.render(scene,cam);
}

const TIPS=['Hold ⚙️ to open the weapon wheel.','Drag right side of screen to rotate camera.','Talk to Elder Maris for the main quest.','Upgrade Strength to deal more damage.','Wolves roam the forest — be careful!'];
$('lm').textContent=TIPS[Math.floor(Math.random()*TIPS.length)];

async function boot(){
  const f=$('lf');
  const steps=[
    ['Sculpting terrain…',  ()=>{loadChunk('village');},20],
    ['Building village…',   ()=>{},40],
    ['Growing forest…',     ()=>{loadChunk('forest');},60],
    ['Opening market…',     ()=>{},78],
    ['Placing bandits…',    ()=>{},90],
    ['Starting world…',     ()=>{loop();},100],
  ];
  for(const[msg,fn,pct]of steps){$('lm').textContent=msg;fn();f.style.width=pct+'%';await new Promise(r=>setTimeout(r,350));}
  await new Promise(r=>setTimeout(r,200));
  const ls=$('ls');ls.style.transition='opacity .8s';ls.style.opacity='0';
  setTimeout(()=>ls.style.display='none',850);
  notif('⚔ Welcome to Curse Land!');
}
boot();
